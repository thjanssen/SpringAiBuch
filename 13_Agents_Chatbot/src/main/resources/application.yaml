spring:
  application:
    name: 13_Agents_Chatbot

  ai:
    openai:
      api-key: ${MyVerySecretChatGptKey}

# Die Agenten, an die der ChatAgent per A2A-Protokoll delegiert. Die Beschreibung der Agenten
# holt sich der ChatAgent beim Start von der Agent-Card (<url>/.well-known/agent-card.json).
agents:
  urls:
    - http://localhost:7072   # Bestell-Agent
    - http://localhost:7073   # Produktberater-Agent

logging:
  level:
    org:
      springframework:
        ai: DEBUG
    com:
      thorben:
        janssen:
          spring:
            ai:
              agents: DEBUG

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
