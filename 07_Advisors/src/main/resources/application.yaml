spring:
  application:
    name: 06_Advisors

  ai:
    ollama:
      chat:
        model: qwen3
    openai:
      api-key: ${MyVerySecretChatGptKey}

  mvc:
    log-request-details: true

logging:
    level:
      org:
        springframework:
          ai: DEBUG
          web: DEBUG


server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
