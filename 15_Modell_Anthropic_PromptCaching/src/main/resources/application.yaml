spring:
  application:
    name: 15_Modell_Anthropic_PromptCaching

  ai:
    anthropic:
      api-key: ${MyVerySecretAnthropicKey}
      chat:
        cache-options:
          strategy: SYSTEM_ONLY
  mvc:
    log-request-details: true

logging:
    level:
      org:
        springframework:
          ai:
            chat:
              client:
                advisor: DEBUG