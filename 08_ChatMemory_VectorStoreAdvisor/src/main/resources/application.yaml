spring:
  application:
    name: ChatMemory_VectorStoreAdvisor

  ai:
    openai:
      api-key: ${MyVerySecretChatGptKey}

  mvc:
    log-request-details: true

logging:
    level:
      org:
        springframework:
          ai: DEBUG
          web: DEBUG
      org.springframework.ai.openai.OpenAiEmbeddingModel: TRACE

server:
  error:
    include-message: always